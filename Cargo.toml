[package]
name = "klip"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "A simple Wayland screenshot tool"
authors = ["Stephan Victor Schönbeck"]
homepage = "https://github.com/schonbeck/klip"
readme = "README.md"
license = "MIT"
repository = "https://github.com/schonbeck/klip"
publish = false

[dependencies]
ashpd = { version = "0.14.3", default-features = false, features = ["async-io", "screenshot", "global_shortcuts"] }
futures-channel = "0.3"
futures-util = { version = "0.3", default-features = false }
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_12"] }
ksni = { version = "0.3", default-features = false, features = ["async-io"] }

[profile.release]
lto = true
strip = true

[package.metadata.deb]
maintainer = "Stephan Victor Schönbeck <stephan@schonbeck.dev>"
copyright = "2026 Stephan Victor Schönbeck / Schönbeck ApS"
license-file = ["LICENSE", "0"]
section = "graphics"
priority = "optional"
revision = ""
depends = "$auto"
recommends = "xdg-desktop-portal, xdg-desktop-portal-gnome | xdg-desktop-portal-kde | xdg-desktop-portal-wlr"
extended-description = """\
klip is a small native region screenshot tool for Wayland desktops (GNOME \
first). Press a shortcut, drag a rectangle, annotate it with arrows, lines \
or ellipses, then copy it to the clipboard or save it as a PNG. It runs in \
the background with a tray icon and a configurable global shortcut."""
assets = [
    ["target/release/klip", "usr/bin/", "755"],
    ["data/io.github.schonbeck.klip.desktop", "usr/share/applications/", "644"],
    ["data/io.github.schonbeck.klip.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["README.md", "usr/share/doc/klip/", "644"],
    ["LICENSE", "usr/share/doc/klip/", "644"],
]
