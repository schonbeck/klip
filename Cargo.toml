[package]
name = "klip"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "A tiny native Wayland region screenshot tool"
license = "MIT"
repository = "https://github.com/schonbeck/klip"
publish = false

[dependencies]
ashpd = { version = "0.14.3", default-features = false, features = ["async-io", "screenshot"] }
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_12"] }

[profile.release]
lto = true
strip = true
